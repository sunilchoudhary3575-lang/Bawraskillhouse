</main><script src="certificate.js"></script><script>
const form=document.getElementById('editor');
const studio=BawraCertificate.mount(document.querySelector('.bsh-certificate'));
function values(){return Object.fromEntries(new FormData(form));}
form.addEventListener('input',()=>{studio.update(values());document.getElementById('status').textContent='Preview updated. Changes stay in this browser session.';});
form.addEventListener('submit',e=>e.preventDefault());
document.getElementById('print').addEventListener('click',async()=>{if(!form.reportValidity())return;await studio.update(values());await studio.ready;window.print();});
window.certificateStudio=studio;
window.certificateReady=studio.ready;
